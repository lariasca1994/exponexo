<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" stroke="#334155" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Outer Hexagonal Pavilion Structure (Fair Architecture) -->
  <g filter="url(#shadow)">
    <path d="M256 96 L396 177 V339 L256 420 L116 339 V177 Z" 
          stroke="url(#primaryGrad)" 
          stroke-width="14" 
          stroke-linejoin="round" 
          fill="#1e293b" 
          fill-opacity="0.45"/>

    <!-- Central Nexus Nodes & Beams (ExpoNexo Networking) -->
    <path d="M256 96 L256 256" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-dasharray="8 8"/>
    <path d="M396 339 L256 256" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
    <path d="M116 339 L256 256" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>

    <!-- Hex Corner Stand Anchors -->
    <circle cx="256" cy="96" r="18" fill="url(#primaryGrad)"/>
    <circle cx="396" cy="177" r="16" fill="url(#emeraldGrad)"/>
    <circle cx="396" cy="339" r="18" fill="url(#emeraldGrad)"/>
    <circle cx="256" cy="420" r="16" fill="url(#accentGrad)"/>
    <circle cx="116" cy="339" r="18" fill="url(#accentGrad)"/>
    <circle cx="116" cy="177" r="16" fill="url(#primaryGrad)"/>

    <!-- Central Core Nexus (Active Meeting Point) -->
    <circle cx="256" cy="256" r="46" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="8"/>
    <circle cx="256" cy="256" r="24" fill="url(#accentGrad)"/>
    <circle cx="256" cy="256" r="10" fill="#ffffff"/>
  </g>
</svg>
