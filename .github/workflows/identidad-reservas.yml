name: CI/CD Identidad y Reservas

on:
  push:
    branches: [main]
    paths:
      - 'servicios/identidad-reservas/**'
      - '.github/workflows/identidad-reservas.yml'
  pull_request:
    branches: [main]
    paths:
      - 'servicios/identidad-reservas/**'
      - '.github/workflows/identidad-reservas.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pruebas:
    name: Pruebas Unitarias y de Integración
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicios/identidad-reservas

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: servicios/identidad-reservas/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Generar claves RSA de prueba para JWT
        run: |
          mkdir -p claves
          openssl genrsa -out claves/jwt-rs256.key 2048
          openssl rsa -in claves/jwt-rs256.key -pubout -out claves/jwt-rs256.pub

      - name: Ejecutar pruebas con cobertura
        env:
          ENTORNO: desarrollo
          BASE_DATOS_URL: sqlite:///:memory:
          LLAVE_PRIVADA_RSA_PEM: claves/jwt-rs256.key
          LLAVE_PUBLICA_RSA_PEM: claves/jwt-rs256.pub
          LLAVE_SECRETA_SIMETRICA: clave-super-secreta-ci-minimo-32-bytes!
        run: |
          pytest pruebas -v --cov=app --cov-report=xml

  construir-y-desplegar:
    name: Construir Imagen y Desplegar en Azure Container Apps
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: produccion

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Autenticar en Azure vía OIDC (Sin secretos en texto plano)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Iniciar sesión en Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v5
        with:
          context: ./servicios/identidad-reservas
          file: ./servicios/identidad-reservas/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/exponexo-identidad-reservas:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/exponexo-identidad-reservas:latest

      - name: Actualizar Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: exponexo-identidad-reservas
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_NAME }}.azurecr.io/exponexo-identidad-reservas:${{ github.sha }}

      - name: Comprobar salud del servicio
        run: |
          curl --fail --retry 5 --retry-delay 10 https://${{ secrets.APP_DOMAIN_IDENTIDAD }}/salud
