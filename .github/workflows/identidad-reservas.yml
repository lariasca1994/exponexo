name: CI/CD Identidad y Reservas

on:
  push:
    branches: [main]
    paths:
      - 'servicios/identidad-reservas/**'
      - '.github/workflows/identidad-reservas.yml'
      - '.github/scripts/variables_ejecucion.py'
  pull_request:
    branches: [main]
    paths:
      - 'servicios/identidad-reservas/**'
      - '.github/workflows/identidad-reservas.yml'
      - '.github/scripts/variables_ejecucion.py'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  pruebas:
    name: Pruebas Unitarias y de Integración
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicios/identidad-reservas

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: servicios/identidad-reservas/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generar claves RSA de prueba para JWT
        run: |
          mkdir -p claves
          openssl genrsa -out claves/jwt-rs256.key 2048
          openssl rsa -in claves/jwt-rs256.key -pubout -out claves/jwt-rs256.pub

      - name: Ejecutar pruebas con cobertura
        env:
          APP_ENTORNO: desarrollo
          APP_PUERTO: '8001'
          DATABASE_URL: 'sqlite:///:memory:'
          JWT_CLAVE_PRIVADA_RUTA: claves/jwt-rs256.key
          MFA_CLAVE_CIFRADO: clave-ci-solo-para-pruebas-locales!
          INTERNO_SECRETO: secreto-ci-solo-para-pruebas-locales!
        run: |
          pytest pruebas -v --cov=app --cov-report=xml

  publicar-imagen:
    name: Publicar Imagen en GitHub Container Registry
    needs: pruebas
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: produccion

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v7
        with:
          context: ./servicios/identidad-reservas
          file: ./servicios/identidad-reservas/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/exponexo-identidad-reservas:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/exponexo-identidad-reservas:latest

      - name: Autenticar en Azure vía OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configurar descarga de GHCR privado si hay credencial
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: |
          if [ -n "$GHCR_READ_TOKEN" ]; then
            az containerapp registry set \
              --name exponexo-identidad-reservas \
              --resource-group "$RESOURCE_GROUP" \
              --server ghcr.io \
              --username "$GHCR_USERNAME" \
              --password "$GHCR_READ_TOKEN"
          else
            echo "::notice::La imagen GHCR debe ser pública o la Container App debe tener credenciales de registry configuradas."
          fi

      - name: Configurar Python para las migraciones
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Aplicar migraciones en Azure SQL
        # Se aplican aquí y no al arrancar el contenedor: así arranca rápido y Azure no lo reinicia
        # mientras migra. La base escala a cero: el primer intento la despierta y puede fallar
        # con tiempo agotado, por eso se reintenta.
        working-directory: servicios/identidad-reservas
        env:
          APP_ENTORNO: migracion
          SQLSERVER_SERVIDOR: ${{ secrets.SQLSERVER_SERVIDOR }}
          SQLSERVER_BASE: ${{ secrets.SQLSERVER_BASE }}
          SQLSERVER_USUARIO: ${{ secrets.SQLSERVER_USUARIO }}
          SQLSERVER_CONTRASENA: ${{ secrets.SQLSERVER_CONTRASENA }}
          SQLSERVER_DRIVER_ODBC: ODBC Driver 18 for SQL Server
        run: |
          if ! ls /opt/microsoft/msodbcsql18/lib64/libmsodbcsql-18*.so* >/dev/null 2>&1; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/microsoft-prod.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" \
              | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
            sudo apt-get update -q && sudo ACCEPT_EULA=Y apt-get install -y -q msodbcsql18 unixodbc-dev
          fi
          python -m pip install -q -r requirements.txt
          for intento in 1 2 3 4 5; do
            # Migraciones aquí (no al arrancar el contenedor): la base solo
            # despierta en el despliegue y cuando alguien usa el servicio
            python -m alembic upgrade head && exit 0
            echo "::warning::Intento $intento de migración falló (la base puede estar despertando); reintento en 30 s"
            sleep 30
          done
          exit 1

      - name: Desplegar imagen y configuración en Azure Container Apps
        # Secretos de la Container App (gratis, cifrados) + variables + imagen en una sola revisión
        env:
          SQLSERVER_SERVIDOR: ${{ secrets.SQLSERVER_SERVIDOR }}
          SQLSERVER_BASE: ${{ secrets.SQLSERVER_BASE }}
          SQLSERVER_USUARIO: ${{ secrets.SQLSERVER_USUARIO }}
          SQLSERVER_CONTRASENA: ${{ secrets.SQLSERVER_CONTRASENA }}
          MFA_CLAVE_CIFRADO: ${{ secrets.MFA_CLAVE_CIFRADO }}
          ENTRADA_QR_CLAVE_FIRMA: ${{ secrets.ENTRADA_QR_CLAVE_FIRMA }}
          INTERNO_SECRETO: ${{ secrets.INTERNO_SECRETO }}
          JWT_CLAVE_PRIVADA_PEM: ${{ secrets.JWT_CLAVE_PRIVADA_PEM }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_REMITENTE_CORREO: ${{ secrets.BREVO_REMITENTE_CORREO }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.EVENTOS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EVENTOS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SNS_TEMA_EVENTOS_ARN: ${{ vars.SNS_TEMA_EVENTOS_ARN }}
          IDENTIDAD_URL: ${{ vars.IDENTIDAD_URL }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 .github/scripts/variables_ejecucion.py identidad-reservas exponexo-identidad-reservas \
            "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            "ghcr.io/${{ github.repository_owner }}/exponexo-identidad-reservas:${{ github.sha }}"

      - name: Comprobar salud del servicio
        run: |
          fqdn=$(az containerapp show --name exponexo-identidad-reservas \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn --output tsv)
          curl --fail --retry 10 --retry-delay 15 --retry-all-errors "https://$fqdn/salud"

      - name: Registrar el webhook del bot de Telegram
        # Telegram entrega aquí el «Iniciar» con el que cada persona vincula su chat desde Mi cuenta.
        # Solo se aceptan mensajes con el token secreto (derivado de INTERNO_SECRETO, igual que el servicio).
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          INTERNO_SECRETO: ${{ secrets.INTERNO_SECRETO }}
          IDENTIDAD_URL: ${{ vars.IDENTIDAD_URL }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          secreto = hashlib.sha256(f"telegram:{os.environ['INTERNO_SECRETO']}".encode()).hexdigest()[:48]
          datos = {"url": os.environ["IDENTIDAD_URL"].rstrip("/") + "/v1/telegram/webhook",
                   "secret_token": secreto, "allowed_updates": ["message"], "drop_pending_updates": True}
          peticion = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/setWebhook",
              data=json.dumps(datos).encode(), headers={"content-type": "application/json"})
          with urllib.request.urlopen(peticion, timeout=30) as respuesta:
              resultado = json.load(respuesta)
          if not resultado.get("ok"):
              raise SystemExit("Telegram rechazó el webhook")
          print("Webhook de Telegram registrado")
          PY

