name: CI/CD Mesa de Ayuda y Monitoreo

on:
  push:
    branches: [main]
    paths:
      - 'servicios/mesa-ayuda/**'
      - '.github/workflows/mesa-ayuda.yml'
  pull_request:
    branches: [main]
    paths:
      - 'servicios/mesa-ayuda/**'
      - '.github/workflows/mesa-ayuda.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pruebas:
    name: Pruebas Unitarias y de Integración (xUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicios/mesa-ayuda

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependencias
        run: dotnet restore MesaAyuda.sln

      - name: Ejecutar pruebas
        run: dotnet test MesaAyuda.sln --no-restore --verbosity normal

  construir-y-desplegar:
    name: Construir Imagen y Desplegar en Azure Container Apps
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: produccion

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Autenticar en Azure vía OIDC (Sin secretos en texto plano)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Iniciar sesión en Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v5
        with:
          context: ./servicios/mesa-ayuda
          file: ./servicios/mesa-ayuda/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/exponexo-mesa-ayuda:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/exponexo-mesa-ayuda:latest

      - name: Actualizar Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: exponexo-mesa-ayuda
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_NAME }}.azurecr.io/exponexo-mesa-ayuda:${{ github.sha }}

      - name: Comprobar salud del servicio
        run: |
          curl --fail --retry 5 --retry-delay 10 https://${{ secrets.APP_DOMAIN_MESA_AYUDA }}/salud
