name: Pruebas E2E de Integración

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Suite de Integración E2E del Ciclo de Vida
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de identidad-reservas y pruebas
        run: |
          python -m pip install --upgrade pip
          pip install -r servicios/identidad-reservas/requirements.txt
          pip install pytest pytest-cov

      - name: Generar claves RSA para la prueba
        run: |
          mkdir -p claves
          openssl genrsa -out claves/jwt-rs256.key 2048
          openssl rsa -in claves/jwt-rs256.key -pubout -out claves/jwt-rs256.pub

      - name: Ejecutar pruebas E2E
        env:
          ENTORNO: desarrollo
          BASE_DATOS_URL: sqlite:///:memory:
          LLAVE_PRIVADA_RSA_PEM: claves/jwt-rs256.key
          LLAVE_PUBLICA_RSA_PEM: claves/jwt-rs256.pub
          LLAVE_SECRETA_SIMETRICA: e2e-secreta-simetrica-minimo-32-bytes!
        run: |
          pytest pruebas/test_e2e_integration.py -v
