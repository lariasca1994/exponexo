name: Pruebas E2E de Integración

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Suite de Integración E2E del Ciclo de Vida
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Instalar dependencias de identidad-reservas y pruebas
        run: |
          python -m pip install --upgrade pip
          pip install -r servicios/identidad-reservas/requirements-dev.txt

      - name: Generar claves RSA para la prueba
        run: |
          mkdir -p claves
          openssl genrsa -out claves/jwt-rs256.key 2048
          openssl rsa -in claves/jwt-rs256.key -pubout -out claves/jwt-rs256.pub

      - name: Ejecutar pruebas E2E
        env:
          APP_ENTORNO: desarrollo
          APP_PUERTO: '8001'
          DATABASE_URL: 'sqlite:///:memory:'
          JWT_CLAVE_PRIVADA_RUTA: claves/jwt-rs256.key
          MFA_CLAVE_CIFRADO: clave-e2e-solo-para-pruebas-locales!
          INTERNO_SECRETO: secreto-e2e-solo-para-pruebas-locales!
        run: |
          pytest pruebas/test_e2e_integration.py -v
