services:
  identidad-reservas:
    build:
      context: ./servicios/identidad-reservas
      dockerfile: Dockerfile
    container_name: exponexo-identidad-reservas
    ports:
      - "8001:8001"
    environment:
      - APP_ENTORNO=desarrollo
      - DATABASE_URL=sqlite:////app/data/identidad.db
      - JWT_CLAVE_PRIVADA_RUTA=/app/data/jwt_privada.pem
      - CORS_ORIGENES_PERMITIDOS=http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./datos/identidad:/app/data
    networks:
      - exponexo-net

  pagos:
    build:
      context: ./servicios/pagos
      dockerfile: Dockerfile
    container_name: exponexo-pagos
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - SPRING_PROFILES_ACTIVE=desarrollo
      - JWT_JWKS_URL=http://identidad-reservas:8001/.well-known/jwks.json
    networks:
      - exponexo-net
    depends_on:
      - identidad-reservas

  mesa-ayuda:
    build:
      context: ./servicios/mesa-ayuda
      dockerfile: Dockerfile
    container_name: exponexo-mesa-ayuda
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - ASPNETCORE_ENVIRONMENT=Development
      - JWT_JWKS_URL=http://identidad-reservas:8001/.well-known/jwks.json
    networks:
      - exponexo-net
    depends_on:
      - identidad-reservas

networks:
  exponexo-net:
    driver: bridge
