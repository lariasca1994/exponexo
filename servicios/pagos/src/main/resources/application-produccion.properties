# Producción: Oracle Autonomous Database con Wallet mTLS
spring.datasource.url=jdbc:oracle:thin:@${ORACLE_TNS_ALIAS}?TNS_ADMIN=${ORACLE_WALLET_RUTA}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${ORACLE_USUARIO}
spring.datasource.password=${ORACLE_CONTRASENA}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/oracle
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWKS_URL}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_EMISOR}
exponexo.jwt.issuer=${JWT_EMISOR}
exponexo.jwt.audience=${JWT_AUDIENCIA}
exponexo.jwt.jwks-url=${JWT_JWKS_URL}
exponexo.internal-secret=${INTERNO_SECRETO}
exponexo.qr.signing-key=${COBRO_QR_CLAVE_FIRMA}
