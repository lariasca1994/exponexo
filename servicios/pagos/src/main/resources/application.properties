spring.application.name=pagos
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8002}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:desarrollo}

# JSON en snake_case (ADR-014)
spring.jackson.property-naming-strategy=SNAKE_CASE

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Propiedades ExpoNexo Pagos
exponexo.portal-url=${PORTAL_URL:http://localhost:5173}
exponexo.cors-allowed-origins=${CORS_ORIGENES_PERMITIDOS:http://localhost:5173}
exponexo.jwt.issuer=${JWT_EMISOR:http://localhost:8001}
exponexo.jwt.audience=${JWT_AUDIENCIA:exponexo}
exponexo.jwt.jwks-url=${JWT_JWKS_URL:http://localhost:8001/.well-known/jwks.json}
exponexo.identidad-url=${IDENTIDAD_URL:http://localhost:8001}
exponexo.internal-secret=${INTERNO_SECRETO:dev-interno-secreto}
exponexo.qr.signing-key=${COBRO_QR_CLAVE_FIRMA:dev-qr-signing-key-32-bytes-minimum}
exponexo.qr.expiration-minutes=${COBRO_QR_VIGENCIA_MINUTOS:15}
exponexo.invoice.prefix=${FACTURA_PREFIJO:EXN}
exponexo.invoice.currency=${FACTURA_MONEDA:COP}
exponexo.invoice.tax-percentage=${FACTURA_IMPUESTO_PORCENTAJE:19.00}
