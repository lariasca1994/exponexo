<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>{{titulo}} · ExpoNexo</title>
  </head>
  <body style="font-family: Inter, system-ui, sans-serif; color: #0f172a; background: #f8fafc; padding: 24px;">
    <div style="max-width: 560px; margin: 0 auto; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px;">
      <p style="margin: 0 0 8px 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #1d4ed8; font-weight: 700;">
        ExpoNexo · Recinto Ferial
      </p>
      <h1 style="margin: 0 0 16px 0; font-size: 20px; color: #0f172a;">{{titulo}}</h1>
      <p style="margin: 0 0 16px 0; font-size: 15px; line-height: 1.6; color: #334155;">
        {{mensaje}}
      </p>
      <p style="margin: 0 0 20px 0;">
        <a href="{{enlace_portal}}" style="display: inline-block; background: #1d4ed8; color: #ffffff; text-decoration: none; padding: 10px 16px; border-radius: 8px; font-weight: 600;">
          Abrir el portal de ExpoNexo
        </a>
      </p>
      <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;" />
      <p style="margin: 0; font-size: 12px; color: #64748b;">
        Por tu seguridad, este mensaje nunca incluye contraseñas, códigos de verificación ni datos de medios de pago.
      </p>
    </div>
  </body>
</html>
