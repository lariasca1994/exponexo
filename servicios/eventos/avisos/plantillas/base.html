<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{titulo}} · ExpoNexo</title>
  </head>
  <!-- Colores del portal (portal/src/estilos/tokens.css): fondo #f8fafc, marca #0284c7. -->
  <body style="margin:0;padding:0;background:#f8fafc;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;padding:24px 12px;"><tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#0f172a;">
        <tr><td style="background:#e0f2fe;border-top:4px solid #0284c7;padding:16px 28px;">
          <img src="{{logo}}" width="28" height="28" alt="" style="vertical-align:middle;border:0;border-radius:6px;margin-right:10px;" />
          <span style="vertical-align:middle;font-size:17px;font-weight:700;color:#0f172a;">ExpoNexo</span>
          <span style="vertical-align:middle;font-size:13px;color:#475569;"> · Recinto Ferial</span>
        </td></tr>
        <tr><td style="padding:24px 28px 8px;">
          <h1 style="margin:0 0 14px 0;font-size:20px;line-height:1.35;color:#0f172a;">{{titulo}}</h1>
          <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#475569;">{{mensaje}}</p>
          <p style="margin:0 0 20px 0;">
            <a href="{{enlace_portal}}" style="display:inline-block;background:#0284c7;color:#ffffff;text-decoration:none;padding:11px 20px;border-radius:10px;font-weight:600;font-size:14px;">Abrir el portal de ExpoNexo</a>
          </p>
        </td></tr>
        <tr><td style="padding:16px 28px 22px;border-top:1px solid #e2e8f0;font-size:12px;line-height:1.5;color:#64748b;">
          Por tu seguridad, este mensaje nunca incluye contraseñas, códigos de verificación ni datos de medios de pago.
        </td></tr>
      </table>
    </td></tr></table>
  </body>
</html>
